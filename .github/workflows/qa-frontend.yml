name: Frontend QA

on:
  pull_request:
    paths:
      - 'my-app/**'
      - '.github/workflows/qa-frontend.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: my-app
    env:
      CI: 'true'

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test -- --runInBand --watchAll=false

      - name: Test contact Cloudflare and Google contracts
        run: node --test functions/_lib/contact.test.mjs google-apps-script/Code.test.cjs

      - name: Build CRA and static routes
        env:
          REACT_APP_CONTACT_PROVIDER: google
          REACT_APP_TURNSTILE_SITE_KEY: qa-placeholder
        run: npm run build

      - name: Verify real localized build outputs
        run: |
          test -s build/en/index.html
          test -s build/pt-br/index.html
          grep -Fq '<html lang="en"' build/en/index.html
          grep -Fq '<html lang="pt-BR"' build/pt-br/index.html
          grep -Fq 'https://elelier.com/en/' build/en/index.html
          grep -Fq 'https://elelier.com/pt-br/' build/pt-br/index.html
          grep -Fq '<loc>https://elelier.com/en/</loc>' build/sitemap.xml
          grep -Fq '<loc>https://elelier.com/pt-br/</loc>' build/sitemap.xml

      - name: Smoke test public Cloudflare branch Preview (read-only)
        env:
          PREVIEW_BASE: https://feat-seo-05-trilingual-route.elelier.pages.dev
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$PREVIEW_BASE/en/" -o /tmp/preview-en.html
          curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$PREVIEW_BASE/pt-br/" -o /tmp/preview-pt.html
          grep -Fq '<html lang="en"' /tmp/preview-en.html
          grep -Fq '<html lang="pt-BR"' /tmp/preview-pt.html
          grep -Fq 'https://elelier.com/en/' /tmp/preview-en.html
          grep -Fq 'https://elelier.com/pt-br/' /tmp/preview-pt.html

      - name: Restore generated passcodes and inspect diff
        if: always()
        run: |
          git restore src/config/hashedPasscodes.js
          git diff --check
          git status --short

  visual-preview:
    name: Responsive and language visual QA
    if: github.head_ref == 'feat/seo-05-trilingual-routes'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: my-app
    permissions:
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install Playwright without changing lockfile
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture mobile/desktop, light/dark, ES/EN/PT-BR
        run: node scripts/qa-visual-preview.cjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elelier-trilingual-visual-qa
          path: qa-visual-artifacts/
          if-no-files-found: warn
          retention-days: 14
